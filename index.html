<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e2320" />
    <meta name="description" content="Cockpit : le tableau de bord financier de ta boîte, branché sur Pennylane." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Le thème est posé avant le premier affichage : pas de flash blanc.
      try {
        var t = localStorage.getItem('cockpit-theme')
        if (t !== 'clair' && t !== 'sombre') t = matchMedia('(prefers-color-scheme: light)').matches ? 'clair' : 'sombre'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'sombre'
      }
    </script>
    <title>Tableau de bord · Cockpit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
